<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hearts">
    <span>💖</span>
    <span>💕</span>
    <span>💘</span>
    <span>❤️</span>
    <span>💗</span>
    <span>💞</span>
    <span>💓</span>
    <span>💝</span>
    <span>💟</span>
    <span>💜</span>
</div>
<div class="container">

    <img id="mainImage"
src="images/1_giving_heart.png"
alt="">
    <h1 id="question">Will You Be My Valentine? 💖</h1>

    <div class="buttons">
        <button id="yesBtn">YES 💘</button>
        <button id="noBtn">NO 😭</button>
    </div>

    <p id="message"></p>
</div>

<div id="celebration">
    <div class="celebration-content">
        <h1>YAYYYYYYY 💖</h1>
        <img src="images/happy.png" alt="happy">
        <h2>You are officially my Valentine 😭❤️</h2>
        <p>Forever starts now ✨</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
